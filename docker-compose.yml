# PATH: docker-compose.yml
version: '3.8'

services:
  # --- 1. THE STORAGE VAULT (PostgreSQL) ---
  db:
    image: postgres:17
    container_name: ge-solutions-db
    restart: always
    environment:
      POSTGRES_DB: ge_solutions_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: able1212 # Update to match your config
    volumes:
      - ./infra/postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  # --- 2. THE ENGINE (Java Spring Boot) ---
  backend:
    build: ./erp-backend
    container_name: ge-solutions-api
    restart: always
    depends_on:
      - db
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/ge_solutions_db
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    volumes:
      - ./infra/ge_uploads:/ge_uploads # Physically maps scans to your disk

  # --- 3. THE INTERFACE (React/Vite) ---
  frontend:
    build: ./erp-frontend
    container_name: ge-solutions-ui
    restart: always
    ports:
      - "80:5173" # Maps Port 80 (Standard Web) for easy access
    environment:
      - VITE_API_BASE_URL=http://your-server-ip:8080/api/v1