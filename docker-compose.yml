# PATH: docker-compose.yml

services:
  # THE VAULT
  db:
    image: postgres:17
    container_name: ge-solutions-db
    restart: always
    environment:
      POSTGRES_DB: ge_solutions_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: able1212
    volumes:
      - ./infra/postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  # THE ENGINE
  backend:
    build: ./erp-backend
    container_name: ge-solutions-api
    restart: always
    depends_on:
      - db
    ports:
      - "8080:8080"
    environment:
      # We tell Java to talk to the DB service named 'db'
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/ge_solutions_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: able1212
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    volumes:
      - ./infra/ge_uploads:/ge_uploads

  # THE INTERFACE
  frontend:
    build: ./erp-frontend
    container_name: ge-solutions-ui
    restart: always
    ports:
      - "80:80"
    environment:
      - VITE_API_BASE_URL=http://localhost:8080/api/v1