# fix191: GITHUB CHECKS. GitHub runs these by itself on every pull request and on every change to main.
# A red cross on a pull request means: DO NOT MERGE. A green tick means the checks passed.
# It needs no secrets. The server tests use their own in-memory test database.
name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Server tests (mvn test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: erp-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run the server tests
        run: mvn -B -ntp test

  frontend:
    name: Page checks (lint, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: erp-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: erp-frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npx eslint .
      - name: Tests
        run: npm test
      - name: Production build
        run: npm run build
        env:
          VITE_API_BASE_URL: https://example.invalid/api/v1
