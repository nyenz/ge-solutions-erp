name: Apply GES DAY 2
on:
  push:
    branches: [ges-day-upload]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          test -f GES-DAY-changed-files.zip || exit 0
          unzip -o GES-DAY-changed-files.zip
          rm GES-DAY-changed-files.zip
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "GES DAY design on every page"
          git push
