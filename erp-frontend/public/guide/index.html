<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Golden Seed Guide</title>
<!-- fix231 (David): the auto-playing user guide. Per rank, per task: real pictures of the app (recorded on demo data by
     erp-frontend/e2e/guide.mjs), the thing to look at in an orange box, and one plain sentence per step. It plays by
     itself (pause / back / next / pick a step). Served at /guide/ inside the app; the same file is the shareable guide
     (docs/guide/build-guide.mjs puts the pictures inside it). GES website colours. -->
<style>
  :root { --navy:#0b2545; --slate:#1b3a63; --orange:#ea580c; --orangeDk:#c2410c; --ink:#1f2937; --body:#4b5563; --cream:#fdfaf4; --sand:#f3ede2; --line:#e5e7eb; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--cream); color: var(--ink); font-family: 'Poppins', 'Inter', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif; }
  button { font: inherit; cursor: pointer; }
  .app { display: grid; grid-template-columns: 300px 1fr; height: 100vh; }
  /* left: ranks and tasks */
  .side { background: var(--navy); color: #fff; display: flex; flex-direction: column; min-height: 0; }
  .brand { display: flex; align-items: center; gap: 10px; padding: 16px 18px 12px; }
  .brand .gsLogo { width: 36px; height: 36px; flex-shrink: 0; border-radius: 50%; background: #0b2545; border: 2px solid #ea580c; display: grid; place-items: center; font-size: 18px; line-height: 1; }
  .brand b { font-size: 16px; display: block; }
  .brand span { font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: #fdba8c; }
  .roles { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 16px 12px; }
  .chip { border: 1px solid rgba(255,255,255,.25); background: transparent; color: rgba(255,255,255,.85); border-radius: 99px; padding: 5px 11px; font-size: 12px; font-weight: 600; }
  .chip:hover { border-color: #fff; color: #fff; }
  .chip[aria-pressed="true"] { background: var(--orange); border-color: var(--orange); color: #fff; }
  .tasks { list-style: none; margin: 0; padding: 0 10px 16px; overflow-y: auto; flex: 1; scrollbar-width: thin; }
  .task { width: 100%; text-align: left; background: transparent; border: 0; color: #fff; padding: 10px 10px; border-radius: 8px; display: grid; grid-template-columns: 24px 1fr; gap: 2px 8px; }
  .task:hover { background: rgba(255,255,255,.06); }
  .task[aria-current="true"] { background: rgba(234,88,12,.18); box-shadow: inset 3px 0 0 var(--orange); }
  .task .n { grid-row: span 2; width: 24px; height: 24px; border-radius: 50%; background: rgba(255,255,255,.12); display: grid; place-items: center; font-size: 11px; font-weight: 700; }
  .task[aria-current="true"] .n { background: var(--orange); }
  .task b { font-size: 13px; font-weight: 600; }
  .task small { font-size: 11px; color: rgba(255,255,255,.6); }
  /* right: the player */
  .main { display: flex; flex-direction: column; min-width: 0; min-height: 0; padding: 18px 22px 16px; gap: 12px; }
  .head h1 { margin: 0; font-size: 20px; color: var(--navy); }
  .head p { margin: 2px 0 0; color: var(--body); font-size: 13px; }
  .head .tag { display: inline-block; margin-right: 8px; font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--orangeDk); }
  .stage { position: relative; flex: 1; min-height: 0; display: grid; place-items: center; }
  .frame { position: relative; max-width: 100%; max-height: 100%; aspect-ratio: 16 / 9; width: min(100%, calc((100vh - 230px) * 16 / 9)); border-radius: 10px; overflow: hidden; box-shadow: 0 10px 30px rgba(11,37,69,.18); background: #fff; border: 1px solid var(--line); }
  .frame img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .35s ease; }
  .frame img.on { opacity: 1; }
  .hl { position: absolute; border: 3px solid var(--orange); border-radius: 8px; box-shadow: 0 0 0 9999px rgba(11,37,69,.2); transition: all .45s ease; pointer-events: none; }
  .hl.none { opacity: 0; }
  .cap { display: flex; align-items: center; gap: 12px; background: #fff; border: 1px solid var(--line); border-left: 4px solid var(--orange); border-radius: 10px; padding: 12px 14px; min-height: 64px; }
  .cap .s { font-size: 12px; font-weight: 700; color: var(--orangeDk); white-space: nowrap; }
  .cap p { margin: 0; font-size: 15px; line-height: 1.45; color: var(--ink); }
  .bar { display: flex; align-items: center; gap: 10px; }
  .ctl { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: #fff; color: var(--navy); display: grid; place-items: center; font-size: 16px; }
  .ctl:hover { border-color: var(--orange); color: var(--orange); }
  .ctl.play { background: var(--orange); border-color: var(--orange); color: #fff; }
  .dots { display: flex; gap: 6px; flex: 1; }
  .dot { flex: 1; height: 6px; border-radius: 3px; border: 0; background: var(--sand); padding: 0; position: relative; overflow: hidden; }
  .dot.done { background: var(--slate); }
  .dot i { position: absolute; inset: 0; width: 0; background: var(--orange); }
  .dot.now i { animation: fill linear forwards; }
  @keyframes fill { to { width: 100%; } }
  .paused .dot.now i { animation-play-state: paused; }
  .speed { font-size: 12px; color: var(--body); }
  .empty { margin: auto; text-align: center; color: var(--body); }
  @media (max-width: 760px) {
    .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto 1fr; height: auto; min-height: 100vh; }
    .side, .main { min-width: 0; }
    .stage { flex: none; }
    .frame { aspect-ratio: 16 / 9; height: auto; }
    .speed { display: none; }
    .tasks { display: flex; overflow-x: auto; padding: 0 10px 10px; }
    .task { min-width: 200px; }
    .frame { width: 100%; }
    .main { padding: 12px; }
  }
  @media (prefers-reduced-motion: reduce) { .frame img, .hl { transition: none; } }
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="side">
    <div class="brand">
      <span class="gsLogo" aria-hidden="true">&#127793;</span>
      <div><b>Golden Seed Guide</b><span>GE Solutions</span></div>
    </div>
    <div class="roles" id="roles" role="group" aria-label="Show tasks for"></div>
    <ul class="tasks" id="tasks"></ul>
  </aside>
  <main class="main">
    <div class="head"><span class="tag" id="role"></span><h1 id="title">Loading the guide...</h1><p id="why"></p></div>
    <div class="stage"><div class="frame" id="frame"><div class="hl none" id="hl"></div></div></div>
    <div class="cap"><span class="s" id="stepno"></span><p id="cap"></p></div>
    <div class="bar" id="bar">
      <button class="ctl" id="prev" aria-label="Back one step" title="Back one step">&#9664;</button>
      <button class="ctl play" id="play" aria-label="Pause" title="Pause / play">&#10073;&#10073;</button>
      <button class="ctl" id="next" aria-label="Next step" title="Next step">&#9654;</button>
      <div class="dots" id="dots"></div>
      <span class="speed">Arrow keys or space also work</span>
    </div>
  </main>
</div>
<script>
(function () {
  var STEP_MS = 6500;
  var DATA = window.GUIDE_DATA || null;           // the shareable file has the guide inside it
  var $ = function (id) { return document.getElementById(id); };
  var state = { role: 'All', task: 0, step: 0, playing: true, timer: null };
  var tasksShown = [];

  function start(data) {
    DATA = data;
    // fix262 (David): a person sees the guides of their own rank and the ranks below it, never a higher rank's
    // (?rank=Secretary). Without ?rank (the shareable file) every guide shows.
    var LEVEL = { 'employee': 0, 'secretary': 1, 'manager': 2, 'director': 3 };
    var rank = (new URLSearchParams(location.search).get('rank') || '').toLowerCase();
    if (rank && LEVEL[rank] !== undefined) {
      data = Object.assign({}, data, { tasks: data.tasks.filter(function (t) {
        var lv = LEVEL[String(t.role).toLowerCase()];
        return t.role === 'All staff' || lv === undefined || lv <= LEVEL[rank];
      }) });
      DATA = data;
    }
    var roles = ['All'];
    data.tasks.forEach(function (t) { if (t.role !== 'All staff' && roles.indexOf(t.role) < 0) roles.push(t.role); });
    var want = (new URLSearchParams(location.search).get('role') || '').toLowerCase();
    roles.forEach(function (r) { if (r.toLowerCase() === want) state.role = r; });
    $('roles').innerHTML = '';
    roles.forEach(function (r) {
      var b = document.createElement('button'); b.className = 'chip'; b.textContent = r === 'All' ? 'Everyone' : r;
      b.setAttribute('aria-pressed', String(r === state.role));
      b.onclick = function () { state.role = r; Array.prototype.forEach.call($('roles').children, function (c) { c.setAttribute('aria-pressed', String(c === b)); }); list(); open(0); };
      $('roles').appendChild(b);
    });
    list(); open(0);
  }
  function list() {
    tasksShown = DATA.tasks.filter(function (t) { return state.role === 'All' || t.role === state.role || t.role === 'All staff'; });
    var ul = $('tasks'); ul.innerHTML = '';
    tasksShown.forEach(function (t, i) {
      var li = document.createElement('li'); var b = document.createElement('button'); b.className = 'task';
      b.innerHTML = '<span class="n">' + (i + 1) + '</span><b></b><small></small>';
      b.querySelector('b').textContent = t.title; b.querySelector('small').textContent = t.role + ' · ' + t.steps.length + ' steps';
      b.onclick = function () { open(i); };
      li.appendChild(b); ul.appendChild(li);
    });
  }
  function src(img) { return (DATA.images && DATA.images[img]) || img; }
  function open(i) {
    if (!tasksShown.length) { $('title').textContent = 'No tasks'; return; }
    state.task = (i + tasksShown.length) % tasksShown.length; state.step = 0;
    var t = tasksShown[state.task];
    Array.prototype.forEach.call($('tasks').querySelectorAll('.task'), function (b, k) { b.setAttribute('aria-current', String(k === state.task)); });
    $('role').textContent = t.role; $('title').textContent = t.title; $('why').textContent = t.why;
    var f = $('frame'); Array.prototype.slice.call(f.querySelectorAll('img')).forEach(function (n) { n.remove(); });
    t.steps.forEach(function (s, k) { var im = document.createElement('img'); im.alt = s.cap; im.src = src(s.img); im.dataset.k = k; f.insertBefore(im, $('hl')); });
    var d = $('dots'); d.innerHTML = '';
    t.steps.forEach(function (s, k) { var b = document.createElement('button'); b.className = 'dot'; b.setAttribute('aria-label', 'Step ' + (k + 1)); b.innerHTML = '<i></i>'; b.onclick = function () { show(k); }; d.appendChild(b); });
    show(0);
  }
  function show(k) {
    var t = tasksShown[state.task]; if (!t) return;
    if (k >= t.steps.length) { open(state.task + 1); return; }   // the next task plays by itself
    if (k < 0) k = 0;
    state.step = k; var s = t.steps[k];
    Array.prototype.forEach.call($('frame').querySelectorAll('img'), function (im) { im.classList.toggle('on', Number(im.dataset.k) === k); });
    var hl = $('hl'), W = (DATA.size && DATA.size.width) || 1280, H = (DATA.size && DATA.size.height) || 720;
    if (s.box) { hl.classList.remove('none'); hl.style.left = (s.box.x / W * 100) + '%'; hl.style.top = (s.box.y / H * 100) + '%'; hl.style.width = (s.box.w / W * 100) + '%'; hl.style.height = (s.box.h / H * 100) + '%'; }
    else hl.classList.add('none');
    $('stepno').textContent = 'Step ' + (k + 1) + ' of ' + t.steps.length; $('cap').textContent = s.cap;
    Array.prototype.forEach.call($('dots').children, function (b, j) {
      b.classList.toggle('done', j < k); b.classList.toggle('now', j === k);
      var i = b.querySelector('i'); i.style.animation = 'none'; void i.offsetWidth; i.style.animation = ''; i.style.animationDuration = STEP_MS + 'ms';
    });
    clearTimeout(state.timer);
    if (state.playing) state.timer = setTimeout(function () { show(k + 1); }, STEP_MS);
  }
  function play(on) {
    state.playing = on; $('bar').classList.toggle('paused', !on);
    $('play').innerHTML = on ? '&#10073;&#10073;' : '&#9654;'; $('play').setAttribute('aria-label', on ? 'Pause' : 'Play');
    show(state.step);
  }
  $('prev').onclick = function () { show(state.step - 1); };
  $('next').onclick = function () { show(state.step + 1); };
  $('play').onclick = function () { play(!state.playing); };
  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowRight') show(state.step + 1); else if (e.key === 'ArrowLeft') show(state.step - 1);
    else if (e.key === ' ') { e.preventDefault(); play(!state.playing); }
  });
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) state.playing = false;
  if (DATA) start(DATA);
  else fetch('guide.json').then(function (r) { return r.json(); }).then(start).catch(function () { $('title').textContent = 'The guide could not be loaded. Refresh the page.'; });
})();
</script>
</body>
</html>
