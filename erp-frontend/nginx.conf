# PATH: erp-frontend/nginx.conf
server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # THE VITAL FIX: Directs all paths to React Router
        try_files $uri $uri/ /index.html;
    }

    # fix182: the hashed files in /assets never change, so browsers keep them for a year
    location /assets/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Compression for faster mobile loading in Uganda
    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/javascript text/xml image/svg+xml;

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}