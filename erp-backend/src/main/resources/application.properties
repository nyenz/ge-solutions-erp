# PATH: erp-backend/src/main/resources/application.properties

# ── 1. SYSTEM IDENTITY ──
spring.application.name=ge-solutions-erp
server.port=8080

# ── 2. DATABASE ARCHITECTURE (POSTGRESQL) ──
# LOCAL DEV: jdbc:postgresql://localhost:5432/ge_solutions_db
# DOCKER ONLINE: Change 'localhost' to 'db' to use the internal container link
spring.datasource.url=jdbc:postgresql://localhost:5432/ge_solutions_db
spring.datasource.username=postgres
spring.datasource.password=able1212
spring.datasource.driver-class-name=org.postgresql.Driver

# ── 3. DATA PERSISTENCE (HIBERNATE) ──
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# PERFORMANCE: Prevent connection leaks (Industrial Standard)
spring.jpa.open-in-view=false

# ── 4. SECURITY & AUTH (JWT) ──
# VITAL: Ensure this secret matches your local environment to avoid logging out users
ge.solutions.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
# EXPIRATION: 86400000ms = 24 Hours
ge.solutions.jwt.expiration=86400000

# ── 5. INDUSTRIAL UPLOAD CAPACITY ──
# Hardens the pipe for high-res Deed Plan scans
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
spring.servlet.multipart.enabled=true

# ── 6. FORENSIC LOGGING ──
# Only show critical system alerts in production to save disk space
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=ERROR
logging.level.com.gesolutions.erp=INFO

# ── 7. EMAIL RELAY HARDENING ──
# These values are now driven by MailConfig.java for better security
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true