# PATH: erp-backend/src/main/resources/application.properties

server.port=8080
spring.application.name=ge-solutions-erp

# DATABASE
spring.datasource.url=jdbc:postgresql://localhost:5432/ge_solutions_db
spring.datasource.username=postgres
spring.datasource.password=able1212

# ENGINE SETTINGS
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# SECURITY
ge.solutions.jwt.secret=YTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTI=
ge.solutions.jwt.expiration=86400000

# CLOUDINARY
cloudinary.cloud-name=test
cloudinary.api-key=test
cloudinary.api-secret=test

# MAIL
MAIL_USERNAME=test@gesolutions.com
MAIL_PASSWORD=testpassword

# ADMIN SEED
ADMIN_EMAIL=test@gesolutions.com
ADMIN_DEFAULT_PASSWORD=TestPassword123

# PERFORMANCE
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.initialization-fail-timeout=0

# STARTUP SPEED -- reduce Hibernate scan time
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# FILE UPLOAD LIMITS
# VITAL FIX: Spring Boot's silent default is 1MB per file / 10MB per request
# if these are never set. That was the real cause of the "file too big" error
# firing on files well under 50MB -- the code promised 50MB but never
# configured it. These values are now the single source of truth and match
# the error message in GlobalExceptionHandler exactly.
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=250MB
spring.servlet.multipart.file-size-threshold=2KB
