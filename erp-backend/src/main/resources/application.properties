# PATH: erp-backend/src/main/resources/application.properties

# ── 1. HARDWARE ──
server.port=8080
spring.application.name=ge-solutions-erp

# ── 2. DATABASE SYNC (Postman Standard) ──
# Note: For Docker, we use 'db'. For Postman/Local, use 'localhost'.
# I am setting it to 'db' for the nuclear docker launch.
spring.datasource.url=jdbc:postgresql://db:5432/ge_solutions_db
spring.datasource.username=postgres
spring.datasource.password=able1212
spring.datasource.driver-class-name=org.postgresql.Driver

# ── 3. JPA ENGINE ──
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ── 4. SECURITY (JWT) ──
ge.solutions.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
ge.solutions.jwt.expiration=86400000

# ── 5. UPLOAD PIPE ──
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# ── 6. DIAGNOSTICS ──
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=ERROR