# PATH: erp-backend/src/main/resources/application-test.properties

server.port=8080
spring.application.name=ge-solutions-erp

# USE AN IN-MEMORY DATABASE FOR PLAYWRIGHT TESTS!
# This guarantees the database is always fresh and the password is always TestPassword123.
spring.datasource.url=jdbc:h2:mem:playwrightdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.datasource.driver-class-name=org.h2.Driver

# ENGINE SETTINGS
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# SECURITY
ge.solutions.jwt.secret=YTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTI=
ge.solutions.jwt.expiration=86400000

# CLOUDINARY (Using test mock)
cloudinary.cloud-name=test
cloudinary.api-key=test
cloudinary.api-secret=test

# ADMIN SEED - Guaranteed defaults
ADMIN_EMAIL=test@gesolutions.com
ADMIN_DEFAULT_PASSWORD=TestPassword123
MAIL_USERNAME=test@gmail.com
MAIL_PASSWORD=testpassword

# FILE UPLOAD LIMITS (kept identical to production so test behavior matches reality)
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=250MB
spring.servlet.multipart.file-size-threshold=2KB
