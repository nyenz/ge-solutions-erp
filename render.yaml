# PATH: render.yaml
services:
  # ── BUILDING A: THE ENGINE ──
  - type: web
    name: ge-solutions-api
    runtime: docker
    repo: https://github.com/nyenz/ge-solutions-erp
    dockerContext: .
    dockerfilePath: erp-backend/Dockerfile
    plan: free
    region: oregon
    envVars:
      - key: SPRING_DATASOURCE_URL
        value: jdbc:postgresql://ep-wispy-cell-an2afrm4.c-6.us-east-1.aws.neon.tech/neondb?sslmode=require
      - key: SPRING_DATASOURCE_USERNAME
        value: neondb_owner
      - key: SPRING_DATASOURCE_PASSWORD
        value: npg_ws7xVYrW5GLu
      # VITAL: Forces the app to Port 10000 for faster cloud binding
      - key: PORT
        value: 10000
      # VITAL: Helps Java run in tiny memory
      - key: JAVA_OPTS
        value: "-Xmx384m -Xms384m -XX:+UseSerialGC"

  # ── BUILDING B: THE INTERFACE ──
  - type: web
    name: golden-seed
    env: static
    repo: https://github.com/nyenz/ge-solutions-erp
    rootDir: erp-frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://ge-solutions-api.onrender.com/api/v1