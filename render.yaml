# PATH: render.yaml
services:
  - type: web
    name: ge-solutions-api
    runtime: docker 
    repo: https://github.com/nyenz/ge-solutions-erp
    dockerContext: .
    dockerfilePath: erp-backend/Dockerfile 
    plan: free 
    region: oregon 
    envVars:
      - key: SPRING_DATASOURCE_URL
        value: jdbc:postgresql://ep-wispy-cell-an2afrm4.c-6.us-east-1.aws.neon.tech/neondb?sslmode=require
      - key: SPRING_DATASOURCE_USERNAME
        value: neondb_owner
      - key: SPRING_DATASOURCE_PASSWORD
        value: npg_ws7xVYrW5GLu
      # VITAL: PORT 8080 REMOVED. Render will now auto-detect.

  - type: web
    name: golden-seed
    runtime: static
    repo: https://github.com/nyenz/ge-solutions-erp
    staticPublishPath: erp-frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://ge-solutions-api.onrender.com/api/v1