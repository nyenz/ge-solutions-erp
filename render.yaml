# PATH: render.yaml

# ── BUILDING A: THE ENGINE (BACKEND) ──
services:
  - type: web
    name: ge-solutions-api
    env: docker
    repo: https://github.com/nyenz/ge-solutions-erp
    # VITAL FIXES:
    dockerContext: erp-backend
    dockerfilePath: erp-backend/Dockerfile 
    plan: free 
    region: oregon 
    envVars:
      - key: SPRING_DATASOURCE_URL
        value: jdbc:postgresql://ep-wispy-cell-an2afrm4.c-6.us-east-1.aws.neon.tech/neondb?sslmode=require
      - key: SPRING_DATASOURCE_USERNAME
        value: neondb_owner
      - key: SPRING_DATASOURCE_PASSWORD
        value: npg_ws7xVYrW5GLu
      - key: PORT
        value: 8080

# ── BUILDING B: THE INTERFACE (FRONTEND) ──
# Note: No underscore, CamelCase 'staticSites'
staticSites:
  - name: golden-seed
    repo: https://github.com/nyenz/ge-solutions-erp
    buildCommand: cd erp-frontend && npm install && npm run build
    staticPublishPath: erp-frontend/dist
    # THE REFRESH FIX
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          name: ge-solutions-api
          type: web
          property: host