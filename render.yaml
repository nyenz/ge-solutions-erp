# PATH: render.yaml
services:
  # --- BUILDING A: THE ENGINE (BACKEND) ---
  - type: web
    name: ge-solutions-api
    runtime: docker 
    repo: https://github.com/nyenz/ge-solutions-erp
    dockerContext: .
    dockerfilePath: erp-backend/Dockerfile 
    plan: free 
    region: oregon 
    envVars:
      - key: SPRING_DATASOURCE_URL
        value: jdbc:postgresql://ep-wispy-cell-an2afrm4.c-6.us-east-1.aws.neon.tech/neondb?sslmode=require
      - key: SPRING_DATASOURCE_USERNAME
        value: neondb_owner
      - key: SPRING_DATASOURCE_PASSWORD
        value: npg_ws7xVYrW5GLu
      - key: PORT
        value: 8080

  # --- BUILDING B: THE INTERFACE (FRONTEND) ---
  - type: web
    name: golden-seed # FIXED: Renamed for a professional URL
    env: static
    repo: https://github.com/nyenz/ge-solutions-erp
    buildCommand: cd erp-frontend && npm install && npm run build
    staticPublishPath: erp-frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          name: ge-solutions-api
          type: web
          property: host