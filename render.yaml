# PATH: render.yaml
services:
  - type: web
    name: ge-solutions-api
    env: docker
    repo: https://github.com/nyenz/ge-solutions-erp
    dockerContext: .
    dockerfilePath: erp-backend/Dockerfile
    plan: free
    region: oregon
    # VITAL FIX: Must match the exact path in AuthController.
    # AuthController is mapped to /api/v1/auth, so the health
    # endpoint full path is /api/v1/auth/health — not /api/v1/health.
    healthCheckPath: /api/v1/auth/health
    envVars:
      - key: SPRING_DATASOURCE_URL
        value: jdbc:postgresql://ep-wispy-cell-an2afrm4.c-6.us-east-1.aws.neon.tech/neondb?sslmode=require
      - key: SPRING_DATASOURCE_USERNAME
        value: neondb_owner
      - key: SPRING_DATASOURCE_PASSWORD
        value: npg_ws7xVYrW5GLu
      - key: JAVA_OPTS
        value: "-Xms128m -Xmx384m -XX:+UseContainerSupport"

  - type: web
    name: golden-seed
    env: static
    repo: https://github.com/nyenz/ge-solutions-erp
    rootDir: erp-frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://ge-solutions-api.onrender.com/api/v1