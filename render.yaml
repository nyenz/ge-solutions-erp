# PATH: render.yaml
services:
  # --- BUILDING A: THE ENGINE (BACKEND) ---
  - type: web
    name: ge-solutions-api
    env: docker
    repo: https://github.com/nyenz/ge-solutions-erp
    # Points to the root folder then looks inside erp-backend
    dockerContext: .
    dockerfilePath: erp-backend/Dockerfile 
    plan: free 
    region: oregon 
    envVars:
      - key: SPRING_DATASOURCE_URL
        value: jdbc:postgresql://ep-wispy-cell-an2afrm4.c-6.us-east-1.aws.neon.tech/neondb?sslmode=require
      - key: SPRING_DATASOURCE_USERNAME
        value: neondb_owner
      - key: SPRING_DATASOURCE_PASSWORD
        value: npg_ws7xVYrW5GLu
      - key: PORT
        value: 8080

# --- BUILDING B: THE INTERFACE (FRONTEND) ---
staticSites:
  - name: golden-seed
    repo: https://github.com/nyenz/ge-solutions-erp
    buildCommand: cd erp-frontend && npm install && npm run build
    staticPublishPath: erp-frontend/dist
    # VITAL: THE REFRESH FIX (Fixes the 'Not Found' error on refresh)
    routes:
      - type: rewrite
        source: /*
        destination: /index.html