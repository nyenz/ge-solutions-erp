# PATH: render.yaml
services:
  # ── BUILDING A: THE ENGINE (BACKEND) ──
  - type: web
    name: ge-solutions-api
    env: docker 
    repo: https://github.com/nyenz/ge-solutions-erp
    dockerContext: erp-backend
    dockerfilePath: Dockerfile 
    plan: free 
    region: oregon 
    envVars:
      - key: SPRING_DATASOURCE_URL
        value: jdbc:postgresql://ep-wispy-cell-an2afrm4.c-6.us-east-1.aws.neon.tech/neondb?sslmode=require
      - key: SPRING_DATASOURCE_USERNAME
        value: neondb_owner
      - key: SPRING_DATASOURCE_PASSWORD
        value: npg_ws7xVYrW5GLu
      - key: PORT
        value: 8080

  # ── BUILDING B: THE INTERFACE (FRONTEND) ──
  - type: web
    name: golden-seed
    env: static # This tells Render it's a Static Website
    repo: https://github.com/nyenz/ge-solutions-erp
    rootDir: erp-frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    # VITAL: THE REFRESH FIX (Prevents 404 on page reload)
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          name: ge-solutions-api
          type: web
          property: host