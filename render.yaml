# PATH: render.yaml
services:
  - type: web
    # The server runs as 'ge-solutions' in Singapore, next to the Neon database (the old Oregon 'ge-solutions-api'
    # service was retired). Keep this name the same as the Render service.
    name: ge-solutions
    env: docker
    repo: https://github.com/nyenz/ge-solutions-erp
    dockerContext: .
    dockerfilePath: erp-backend/Dockerfile
    plan: free
    region: singapore
    # VITAL FIX: Must match the exact path in AuthController.
    # AuthController is mapped to /api/v1/auth, so the health
    # endpoint full path is /api/v1/auth/health — not /api/v1/health.
    healthCheckPath: /api/v1/auth/health
    envVars:
      # the database address is also set only in the Render dashboard (Neon > Connect > the JDBC form)
      - key: SPRING_DATASOURCE_URL
        sync: false
      # fix181: secrets live ONLY in the Render dashboard (Environment tab). sync: false = Render asks for the value
      # there and never reads it from this file. The old password that was written here is in git history: rotate it.
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: GE_SOLUTIONS_JWT_SECRET
        sync: false
      - key: ADMIN_DEFAULT_PASSWORD
        sync: false
      - key: JAVA_OPTS
        value: "-Xms128m -Xmx384m -XX:+UseContainerSupport -Duser.timezone=Africa/Kampala"

  - type: web
    name: golden-seed
    env: static
    repo: https://github.com/nyenz/ge-solutions-erp
    rootDir: erp-frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://ge-solutions.onrender.com/api/v1