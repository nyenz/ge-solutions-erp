# PATH: render.yaml
# Render Blueprint. It manages ONLY the website (golden-seed).
#
# The server is the Render service `ge-solutions` (Docker, Singapore, next to the Neon database
# `ge-solutions-cloud`). It was set up by hand in the Render dashboard, so it is NOT listed here: a Blueprint entry
# with the same name could make Render create a second copy. Its settings live in the dashboard
# (ge-solutions > Environment): SPRING_DATASOURCE_URL (Neon > Connect, the JDBC form), SPRING_DATASOURCE_USERNAME,
# SPRING_DATASOURCE_PASSWORD, GE_SOLUTIONS_JWT_SECRET, ADMIN_DEFAULT_PASSWORD, GE_SOLUTIONS_SEED_DEMO_DATA and
# JAVA_OPTS (-Xms128m -Xmx384m -XX:+UseContainerSupport -Duser.timezone=Africa/Kampala).
# Build: Dockerfile erp-backend/Dockerfile, docker context = repository root. Health check: /api/v1/auth/health.
#
# The old Oregon server `ge-solutions-api` was retired in October 2026 and removed from this file.
services:
  - type: web
    name: golden-seed
    env: static
    repo: https://github.com/nyenz/ge-solutions-erp
    rootDir: erp-frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://ge-solutions.onrender.com/api/v1
